
name: Build BeatBoard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK de BeatBoard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: music-app/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        working-directory: music-app
        run: npm ci

      - name: Configurar variables de Supabase
        working-directory: music-app
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > .env.production

      - name: Compilar aplicación web
        working-directory: music-app
        run: npm run build

      - name: Sincronizar Capacitor con Android
        working-directory: music-app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: music-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatBoard-APK
          path: music-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
